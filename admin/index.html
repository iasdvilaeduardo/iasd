<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração | IASD Vila Eduardo</title><link rel="stylesheet" href="../assets/css/site.css"></head><body class="admin-body"><main class="admin-shell"><a href="../index.html" class="text-link">← Voltar ao site</a><section id="loginView"><p class="eyebrow">Área protegida</p><h1>Administração</h1><p>Entre com a conta cadastrada no Supabase.</p><form id="loginForm" class="admin-form"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="btn-primary">Entrar</button><p class="form-status" role="status"></p></form></section><section id="dashboardView" hidden><div class="admin-top"><div><p class="eyebrow">Painel</p><h1>Conteúdo do portal</h1><p id="adminIdentity"></p></div><button id="signOut" class="btn-secondary">Sair</button></div><p id="adminNotice" class="form-status" role="status"></p><div class="admin-grid"><section><h2>Novo evento</h2><form id="eventForm" class="admin-form"><label>Título<input name="title" required maxlength="120"></label><label>Descrição<textarea name="description" rows="3"></textarea></label><label>Data e horário<input name="starts_at" type="datetime-local" required></label><label>Local<input name="location"></label><label>Departamento<input name="department"></label><label class="check-label"><input name="published" type="checkbox" checked> Publicar agora</label><button class="btn-primary">Salvar evento</button></form></section><section><h2>Novo álbum</h2><form id="albumForm" class="admin-form"><label>Título<input name="title" required maxlength="120"></label><label>Descrição<textarea name="description" rows="3"></textarea></label><label>Data<input name="event_date" type="date"></label><label class="check-label"><input name="published" type="checkbox" checked> Publicar agora</label><button class="btn-primary">Criar álbum</button></form><div id="uploadArea" class="upload-area" hidden><p>Selecione um álbum para enviar fotos.</p></div></section></div><section><h2>Eventos cadastrados</h2><div id="eventAdminList" class="admin-list"></div></section><section><h2>Álbuns cadastrados</h2><div id="albumAdminList" class="admin-list"></div></section></section></main><script src="../assets/js/config.js"></script><script type="module" src="../assets/js/admin.js"></script></body></html>
